[boss_hp_reset]
	#List of mob entity IDs that should have HP reset when players who damaged them die or logout (if enabled).
	#Format: "minecraft:zombie", "minecraft:skeleton", etc.
	#Default: ["minecraft:wither", "minecraft:warden", "minecraft:elder_guardian"]
	mob_to_reset_hp = ["minecraft:wither", "minecraft:warden", "minecraft:elder_guardian"]
	#List of mob entity IDs that should be despawned (silently removed) when players who damaged them die or logout (if enabled).
	#Format: "minecraft:zombie", "minecraft:skeleton", etc.
	#Default: [] (empty)
	mob_to_despawn = []
	#When should the mob reset its HP?
	#ANY_PLAYER_DIES - Reset HP when any player who attacked the mob dies or logs out (if enabled)
	#ALL_PLAYERS_DIE - Reset HP only when all players who attacked the mob die or log out (if enabled)
	#Default: ALL_PLAYERS_DIE
	#Allowed Values: ANY_PLAYER_DIES, ALL_PLAYERS_DIE
	reset_mode = "ALL_PLAYERS_DIE"
	#Combat timeout in seconds. After this time with no damage, player interactions are forgotten.
	#-1 = No timeout (combat never expires)
	#> 0 = Combat expires after X seconds of no damage
	#Default: -1 (no timeout)
	#Range: > -1
	combat_timeout_seconds = -1
	#Should HP reset only trigger if player dies in the same dimension where they fought the mob?
	#true = Player must die in the same dimension as the combat
	#false = Player death in any dimension triggers reset
	#Default: true
	same_dimension_only = true
	#Should boss HP reset when a player logs out?
	#true = Boss HP resets when player logs out (does not apply to singleplayer)
	#false = Boss HP only resets on player death, not logout
	#Default: false
	reset_on_logout = false
	#Enable debug logging for troubleshooting and monitoring.
	#true = Log detailed information about capability attachments, player interactions, and resets
	#false = Only log HP reset events (minimal logging)
	#Default: false
	enable_debug_logging = false
	#Percentage of HP to restore when a reset is triggered.
	#Value should be between 0 and 100.
	#Default: 50
	#Range: 0 ~ 100
	percentage_restored = 50

[utility]
	#Enable smooth animated inventory slot highlight instead of vanilla.
	slot_highlight_enabled = true
	#Enable scaling up cursor-held floating items in the inventory.
	floating_item_scale_enabled = true
	#Enable the breathing animation for empty hands and held items. (Disables sway too)
	item_breathing_enabled = true
	#Enable hand/item shaking and speed changes when player is at low health.
	low_health_shake_enabled = true
	#Enable the atmospheric sky color tinting and dimming when looking near the sun.
	sun_glare_sky_enabled = true
	#Enable the scaling up of the sun's visual size when looking directly at it.
	sun_radius_scale_enabled = true
	#Enable the white screen flash visual effect on a Perfect Hit.
	perfect_hit_flash_enabled = true
	#Enable the first-person hand sway lagging (lazy hand) effect when turning the camera.
	look_sway_enabled = true
	#Enable dynamic opacity for the crosshair depending on whether a target is focused.
	dynamic_crosshair_enabled = true

