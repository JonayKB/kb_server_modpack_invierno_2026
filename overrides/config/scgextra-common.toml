#enables alert ability, aggroing nearby mobs to the their targets
enableAbilityAlert = true
#enables flare ability, summoning 3 infantry mobs
enableAbilityFlare = true
#enables dig ability, allowing mobs to destroy dirt like blocks
enableAbilityDig = true
#enables the Weakness Exposed effect: enemies are stunned and take double damage
enableAbilityWeakness = true
#enables bulletproof capabilities, enables certain mobs to have bulletproof parts
enableAbilityBulletproof = true
#enables bad aim state, certain mobs will fire guns with bad aim at the start but improves over time
enableAbilityBadAim = true
#enables warning state, flash of light appears before a massive attack. disabling would just remove the flash.
#REQUIRES GAME RESTART
enableAbilityWarning = true
#range for how far are mobs aggroed
