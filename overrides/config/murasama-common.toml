#密特拉斯 — 终极武器设置
[murasama_mithras]
	#攻击伤害
	#Range: 0.0 ~ 1.7976931348623157E308
	damage = 21.0
	#攻击速度
	#Range: -10.0 ~ 10.0
	speed = 0.0
	#触及距离
	#Range: 0.0 ~ 1.7976931348623157E308
	reach = 4.0

	#铭文·真实 — 伤害无视减免
	[murasama_mithras.realDamage]
		#是否启用真实伤害
		enabled = true

	#铭文·银壁 — 格挡减伤
	[murasama_mithras.silverWall]
		#是否启用银壁格挡减伤
		enabled = true
		#满血时的减伤比例上限（0.0~1.0，实际减伤=此值×当前生命百分比）
		#Range: 0.0 ~ 1.0
		reductionBase = 0.8

	#铭文·羁绊 — 宠物光环
	[murasama_mithras.bond]
		#是否启用羁绊宠物光环
		enabled = true
		#光环半径（格）
		#Range: > 1
		range = 32
		#每次恢复的最大生命值百分比
		#Range: 0.0 ~ 1.0
		healPercent = 0.01
		#每次恢复的固定生命值
		#Range: 0.0 ~ 1.7976931348623157E308
		healFlat = 1.0

	#铭文·收割 — 击杀获取灵魂能量
	[murasama_mithras.harvest]
		#是否启用收割灵魂能量
		enabled = true
		#每次击杀获得的灵魂能量数量
		#Range: > 0
		soulAmount = 500

	#隐藏效果 — 10秒禁止回血
	[murasama_mithras.noHeal]
		#是否启用禁止回血效果
		enabled = true
		#禁止回血持续时间（刻，20刻=1秒）
		#Range: > 1
		durationTicks = 200

	#隐藏效果 — 概率削减生命值
	[murasama_mithras.hpReduce]
		#是否启用生命削减效果
		enabled = true
		#触发概率 (0.0~1.0)
		#Range: 0.0 ~ 1.0
		chance = 0.2
		#每次削减当前生命值的比例
		#Range: 0.0 ~ 1.0
		currentHpPercent = 0.03
		#每层削减最大生命值的比例（基于原始上限）
		#Range: 0.0 ~ 1.0
		maxHpPercentPerStack = 0.02
		#最大叠加层数
		#Range: > 1
		maxStacks = 5

	#Iron's Spells 联动 — 密特拉斯自带法术（仅在安装 Iron's Spells 时生效）
	[murasama_mithras.ironSpellsIntegration]
		#是否启用 Iron's Spells 联动（为密特拉斯添加自带法术）
		enabled = true
		#神圣守护 (Fortify) 法术等级
		#Range: 0 ~ 100
		fortifyLevel = 10
		#烈焰冲锋 (Burning Dash) 法术等级
		#Range: 0 ~ 100
		burningDashLevel = 10
		#猩红斩击 (Blood Slash) 法术等级
		#Range: 0 ~ 100
		bloodSlashLevel = 5
		#密特拉斯上法术的法力值消耗倍率（0.5=减半，1.0=不变）
		#Range: 0.0 ~ 1.0
		manaCostMultiplier = 0.5

