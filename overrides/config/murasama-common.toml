
#鬼妖村正 — 基础村正设置
[murasama]
	#击杀充能所需数量
	#Range: > 1
	killCountThreshold = 30
	#无攻击后自动收回的秒数
	#Range: > 1
	inactivityTimeoutSeconds = 15
	#出鞘时附加伤害（目标最大生命值百分比）
	#Range: 0.0 ~ 100.0
	additionalDamagePercent = 0.1
	#未出鞘 — 攻击伤害
	#Range: 0.0 ~ 1.7976931348623157E308
	sheathedDamage = 7.0
	#未出鞘 — 攻击速度
	#Range: -10.0 ~ 10.0
	sheathedSpeed = -2.6
	#未出鞘 — 触及距离
	#Range: 0.0 ~ 1.7976931348623157E308
	sheathedReach = 2.0
	#出鞘 — 攻击伤害
	#Range: 0.0 ~ 1.7976931348623157E308
	activeDamage = 21.0
	#出鞘 — 攻击速度
	#Range: -10.0 ~ 10.0
	activeSpeed = 0.0
	#出鞘 — 触及距离
	#Range: 0.0 ~ 1.7976931348623157E308
	activeReach = 4.0

