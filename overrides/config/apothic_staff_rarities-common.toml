# Apothic Staff Rarities tuning for the staff affixes added at the
# Apotheotic Additions tiers (heirloom, artifact, esoteric).
#
# The config has two tiers; combine them as needed.
#
# Tier 1 ([scaling]): one multiplier per rarity, clamped to the range
# 0.01 to 100.0 on read. What a multiplier scales depends on the value:
#   - Autocast and spell affixes: the level range (min and max) and the
#     cooldown, rounded to whole numbers.
#   - Step-function values (mob effect durations, mob effect amplifiers
#     written as a min/steps/step block, the cooldown_reset chance, the
#     mana_shield chance): the per-level step term, so the level-dependent
#     part scales in proportion to the multiplier. The base floor and the
#     step count stay as written in the JSON.
#   - Integer mob effect amplifiers (a bare number rather than a block):
#     the amplifier, rounded to the nearest whole level, so a multiplier
#     close to 1.0 may leave it unchanged.
#   - Concentration is a yes/no flag, so the multiplier does not affect it.
# Set a multiplier to 1.0 to keep the default values for that rarity.
#
# Tier 2 ([overrides]): per-affix, per-rarity, per-field absolute values.
# Leave a field out, or set it to -1 (or -1.0 for floats), to keep the
# default value scaled by the tier 1 multiplier. Any other value replaces
# that field outright, and the multiplier no longer affects it.
#
# [disable]: skip an entire affix category at the AA tiers. Affixes in a
# disabled category get an empty rarity-values map at load, so they cannot
# roll on heirloom, artifact, or esoteric. Only the AA entries added here
# are affected; the common-through-ancient entries from Fallen Gems and
# Affixes are left alone.
#
# Resolution order applied to each affix at load:
#   1. Read the default value from the JSON.
#   2. If [disable.<category>] is true, drop the AA-tier rolls and stop.
#   3. Scale the value by the tier 1 multiplier for that rarity.
#   4. If a tier 2 override for the field is set, replace the scaled value
#      with the override.
#   5. Apply the final value to the live affix instance.
#
# Example: make every esoteric staff affix a little stronger.
#   [scaling]
#   esoteric_multiplier = 1.25
#
# Example: the same global change, plus a fixed cooldown on one affix.
#   [scaling]
#   esoteric_multiplier = 1.25
#   [overrides.autocast.acupuncture.esoteric]
#   cooldown = 90
#
# Edit this file, then run /apothicstaffrarities reload (alias /asr reload,
# requires op level 2) to apply changes without restarting the server.

[scaling]
heirloom_multiplier = 1.0
artifact_multiplier = 1.0
esoteric_multiplier = 1.0

[disable]
autocast = false
mob_effect = false
spell = false
concentration = false
cooldown_reset = false
mana_shield = false

[overrides]

[overrides.autocast.acupuncture.heirloom]
level_min = -1
level_max = -1
cooldown = -1

[overrides.autocast.acupuncture.artifact]
