# NOTE: THIS MOD IS IN BETA AND INJECTS INTO MANY DIFFERENT MODS
# STABILITY NOT GUARANTEED, PROCEED AT YOUR OWN RISK
# Celestweaks Config

# Setting a patch to false is equivalent to default behavior (i.e. it completely disables the fix and related modifications). If the per-module toggles are set to false, it will disable every patch below, regardless of the per-patch value. If true, it will respect the per-patch toggle

version=0.9.9a
# Used for automatic config regeneration, changing this may obliterate your config file, please proceed with caution

preserve=false
# If true, will not recreate your config in event of version mismatch (i.e. mod updates)
#--------------------------------------------------

celescolor=true
# Toggles celescolor, a clientside patch that preserves the cyan-gold tooltip of celestial weapons
# The primary usecase is for mods like Apotheosis, which overwrite the tooltip color during reforges


celestisynth=true
# Toggles all Celestisynth-related patches

#--------------------------------------------------
phantom_target=true
# When true, enables automatic targeting of phantoms by Rainfall turret AI

no_friendly_fire=true
# When true, disables friendly fire of Rainfall turret form

celestial_scaling=true
# When true, scales damage of all Rainfall lasers (including turret form) by your celestial damage attribute

celestial_scale_factor=0.01
# Determines the scaling of Rainfall damage with celestial damage attribute

splash_scaling=true
# When true, converts Rainfall splash damage to be a percentage of your normal on-hit damage, instead of being a flat 2

muzzle_flash=true
# When true, fixes Rainfall turret muzzle flash to orient itself in the direction of the turret, not the player

turret_accuracy=true
# When true, gives Rainfall turret-fired beams perfect accuracy (note the base inaccuracy is very minor regardless)

player_accuracy=true
# When true, gives player-fired Rainfall beams perfect accuracy (note the base inaccuracy is very minor regardless)
#--------------------------------------------------

curios_fix=true
# Toggles all (attempted) fixes for Curios API-related matters. Please note all are highly experimental, stability not guaranteed

#--------------------------------------------------
seven_curses=true
# [EXPERIMENTAL FIX] When true, attempts to fix issues with artifacts exclusive to the Seven Curses from unequipping upon relogs

attribute_reconciliation=false
# [EXPERIMENTAL FIX] When true, attempts to fix issues with curios unequipping on relogs + dimension changes. Disabled by default due to buggy behavior, please proceed with caution

# Thanks to user SaloEater on GitHub for making Curios issue #575 (https://github.com/TheIllusiveC4/Curios/issues/575). The documentation of this bug helped me a lot in creating a fix. Note: this mod does not use the mixin-based solution SaloEater proposes
#--------------------------------------------------

enigmatic_addons=true
# Toggles all Enigmatic Addons-related patches

#--------------------------------------------------
primeval_impact=false
# 'Wherever you go, whatever life throws at you...In Minecraft, the stars in the sky will always have a place for you~'

# (currently force disabled)

charm_of_malice=true
# When true, allows the Totem of Malice to be equipped in the charm slot

artificial_flower_fix=true
# When true, fixes an issue with Magic Quartz Flower-conferred attributes breaking upon deaths or dimension changes

addons_unique_item_fix=true
# When true, fixes an issue that can cause certain items (Charm of Hell Blade, Tome of Void) to never spawn in a world, generally in a highly-modded environment
#--------------------------------------------------

enigmatic_legacy=true
# Toggles all Enigmatic Legacy-related patches

#--------------------------------------------------
harming_potion_fix=true
# When true, applies a "fix" that allows the spellstones which provide a form of effect immunity to also work on Splash Potions of Harming

creation_heart_buff=true
# When true, gives the Heart of Creation +1 spellstone slots when equipped. Note: this patch also automatically overrides the SpellstonesMultiequip config option in Enigmatic Legacy to be true, otherwise this would be useless

intelligent_spellstones=true
# When true, the Non-Euclidean Cube and the Heart of Creation will not clear the negative effects defined below

spellstone_blacklist=[l2complements:emerald_splash]
# Format: [modid:effect_name], separate entries with commas

aggressive_cube=true
# When true, alters Non-Euclidean Cube logic to used tick-based enforcement to clear negative effects

architect_breaker=true
# When true, applies the Architect's Favor mining boost to the mining depth of Astral Breaker as well

architect_luck_fix=true
# When true, fixes the luck modifier of the Architect's Favor so it properly stacks with the Non-Euclidean Cube

etherium_armor_fix=true
# When true, corrects durability and armor values for Etherium armor

enchanter_pearl_compat=true
# [DOESN'T WORK YET] When true, makes the Enchanter's Pearl work with Apotheosis enchanting

el_unique_item_fix=true
# When true, fixes an issue that can cause certain items (Inscrutable Eye, Bottle of Ichor, Celestial Fruit) to never spawn in a world, generally in a highly-modded environment
#--------------------------------------------------

turkish_locale_fix=true
# When true, will enable a fix that prevents crashes with certain mods if your OS/Minecraft language is Turkish

